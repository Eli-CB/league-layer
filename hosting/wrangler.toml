# League Layer's site on Cloudflare (README.md beside this): the files the site workflow's deploy job gathers into _site,
# served as they are. No script, so its requests are free and count nowhere (not against api.leaguelayer.com's 100,000 a day).
# The workflow deploys it (CLOUDFLARE_API_TOKEN secret, CLOUDFLARE_ACCOUNT_ID variable): never run wrangler here yourself.
name = "leaguelayer-site"
compatibility_date = "2026-10-01"

# leaguelayer.com, as a route: it answers every address on the name once its DNS records are Proxied (README.md), and
# Cloudflare never reaches the records' own address (GitHub Pages'). Not a Custom Domain: Cloudflare won't attach one while
# other records hold the name ("externally managed DNS records", Nov 21, 2026), and deleting them first leaves a gap that
# resolvers may remember for 30 minutes (the zone's negative TTL). Every deploy sets exactly this list of routes.
routes = [{ pattern = "leaguelayer.com/*", zone_name = "leaguelayer.com" }]
workers_dev = true

[assets]
directory = "../_site"
# an address with no file: 404.html, answered 404 (as GitHub Pages did)
not_found_handling = "404-page"

# League Layer's site on Cloudflare (README.md beside this): the files the site workflow's deploy job gathers into _site,
# served as they are. No script, so its requests are free and count nowhere (not against api.leaguelayer.com's 100,000 a day).
# The workflow deploys it (CLOUDFLARE_API_TOKEN secret, CLOUDFLARE_ACCOUNT_ID variable): never run wrangler here yourself.
name = "leaguelayer-site"
compatibility_date = "2026-10-01"

# leaguelayer.com, as a Custom Domain: the deploy (not a terminal: wrangler asks there) replaces whatever record the name
# had (GitHub Pages' four A records until Nov 21, 2026). The token's Workers Routes permission on the zone allows it.
# Every deploy sets exactly this list: a domain added in the dashboard and not here is taken off.
routes = [{ pattern = "leaguelayer.com", custom_domain = true }]
workers_dev = true

[assets]
directory = "../_site"
# an address with no file: 404.html, answered 404 (as GitHub Pages did)
not_found_handling = "404-page"
